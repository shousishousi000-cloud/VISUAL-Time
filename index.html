<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ビジュアルタイマー（横型）</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --text: #2b2b2b;
    --sub: #777;
    --off: #e2dfd8;
    --lit: #2fa862;
    --accent: #2fa862;
  }
  :root { color-scheme: light; }
  /* 初期状態はOSの設定に従う。ボタンで切り替えたあとは data-theme が優先される */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1c1c1e; --panel: #2a2a2d; --text: #f0f0f0; --sub: #b4b4ba; --off: #46464c; --track: rgba(0,0,0,.30); --shadow: rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1c1e; --panel: #2a2a2d; --text: #f0f0f0; --sub: #b4b4ba; --off: #46464c; --track: rgba(0,0,0,.30); --shadow: rgba(0,0,0,.55);
  }
  /* ダークブルー：真っ黒より目に優しい紺色の背景 */
  :root[data-theme="navy"] {
    color-scheme: dark;
    --bg: #0f1b2f; --panel: #1b2b45; --text: #eaf0fa; --sub: #a9b8d0; --off: #3a4c6e; --track: rgba(6,14,30,.34); --shadow: rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    display: flex;
    padding: 16px;
  }
  .app {
    margin: auto;
    position: relative;
    width: 100%;
    max-width: 880px;
    background: var(--panel);
    border-radius: 24px;
    padding: 28px 28px 30px;
    box-shadow: 0 6px 30px var(--shadow, rgba(0,0,0,.12));
    text-align: center;
  }
  .readout {
    font-size: clamp(56px, 12vw, 112px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
  }
  .bar {
    position: relative;
    display: flex;
    gap: clamp(3px, .7vw, 8px);
    padding: 14px;
    margin: 22px 0 6px;
    background: var(--track, rgba(128,128,128,.12));
    border-radius: 18px;
  }
  .seg {
    flex: 1;
    min-width: 0;
    aspect-ratio: 1 / var(--sh, 1);   /* 形(--sh)ごとの縦横比。窓の縦横比には左右されない */
    border-radius: 6px;
    background: var(--off);
    transition: background .2s, box-shadow .2s;
  }
  /* ---- バーの形（3種類）：目盛りバー／ブロック（前回の形）／丸いバー（以前の形） ---- */
  body.shape-scale { --sh: 1.9; }
  body.shape-block { --sh: 1.45; }
  body.shape-round { --sh: 1; }
  body.shape-scale .bar { gap: 2px; padding: 10px 12px; border-radius: 10px; }
  body.shape-scale .seg { border-radius: 2px; }
  body.shape-block .seg, body.shape-round .seg { border-radius: 6px; }
  body.mini.shape-scale .bar { gap: min(.3vw, 1px); border-radius: 8px; }
  body.mini.shape-scale .seg { border-radius: 2px; }
  /* 形の選択ボタンの絵 */
  .shapebtn { display: inline-flex; align-items: center; gap: 8px; }
  .shp { display: inline-flex; align-items: center; height: 16px; }
  .shp i { display: block; background: currentColor; opacity: .8; }
  .shp-scale i { width: 3px; height: 16px; margin-right: 1px; border-radius: 1px; }
  .shp-block i { width: 5px; height: 14px; margin-right: 3px; border-radius: 2px; }
  .shp-round i { width: 8px; height: 8px; margin-right: 3px; border-radius: 3px; }
  .seg.on {
    background: var(--lit);
    box-shadow: 0 0 10px -1px var(--lit);
  }
  .seg.on.cur { animation: cur 1s ease-in-out infinite alternate; }
  @keyframes cur { from { opacity: 1; } to { opacity: .5; } }
  .done .seg.on { animation: doneflash .6s ease-in-out infinite alternate; }
  @keyframes doneflash { from { opacity: 1; } to { opacity: .2; } }
  .scale {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--sub);
    padding: 0 6px;
  }
  .hint { font-size: 13px; color: var(--sub); min-height: 20px; margin-top: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-top: 14px; }
  button {
    font: inherit;
    border: 1px solid rgba(128,128,128,.35);
    background: transparent;
    color: var(--text);
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: rgba(128,128,128,.12); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 700; min-width: 120px; font-size: 18px; padding: 11px 20px;
  }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  .preset { padding: 6px 12px; font-size: 14px; }
  .preset.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 700; }
  .adj { min-width: 52px; padding: 6px 10px; font-size: 14px; }
  .setlabel { font-size: 16px; font-weight: 700; min-width: 64px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: min(360px, 60vw); accent-color: var(--accent); }
  .swatch { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .swatch.active { border-color: var(--text); }
  label.chk { font-size: 14px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  /* ---- 演出オフ・色の設定 ---- */
  body.noglow .seg.on { box-shadow: none; }
  body.nofade .seg { transition: none; }
  body.nofade .seg.on.cur { animation: none; }
  .stagelabel { font-size: 14px; color: var(--sub); }
  .stage { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
  .stage input[type=color] {
    width: 36px; height: 28px; padding: 0; cursor: pointer;
    border: 1px solid rgba(128,128,128,.35); border-radius: 8px; background: transparent;
  }
  .tiny { padding: 6px 10px; font-size: 13px; }
  [hidden] { display: none !important; }
  .notehint { font-size: 12.5px; color: var(--sub); margin: 6px auto 0; max-width: 34em; line-height: 1.6; }
  .notehint:empty { display: none; }

  /* ---- スマホ向け ---- */
  #miniBtn { display: none !important; }
  .minitoggle { display: none !important; }   /* スマホ版では「操作を表示」は出さない（非表示モードのボタンをもう一度押して戻す） */
  body { padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); -webkit-tap-highlight-color: transparent; }
  button, input[type=range] { touch-action: manipulation; }
  @media (max-width: 600px) {
    .app { padding: 20px 12px 24px; border-radius: 20px; }
    /* 目盛りを少なくして1つずつを横に大きくし、形の縦横比はPC版と同じに保つ（縦長にならない） */
    body.shape-scale .bar, body.shape-block .bar, body.shape-round .bar { padding: 10px; }
    body.shape-scale .bar { gap: 3px; }
    body.shape-block .bar, body.shape-round .bar { gap: 6px; }
    button { padding: 11px 14px; }
    button.primary { padding: 14px 22px; min-width: 130px; }
    .preset { padding: 9px 12px; }
    .adj { min-width: 56px; padding: 10px; }
    input[type=range] { width: 88%; height: 32px; }
    label.chk { font-size: 15px; padding: 4px 0; }
  }

  /* ---- 進行度に応じた色：プリセット＋自由に選ぶ ---- */
  .colorset { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(128,128,128,.25); }
  .cs-title { font-size: 14px; font-weight: 700; }
  .cs-note { font-size: 12.5px; color: var(--sub); margin-top: 4px; }
  .pgrid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .colorset.dim .pgrid { opacity: .55; }
  .pcard {
    display: flex; flex-direction: column; gap: 7px; width: 132px;
    padding: 10px; border-radius: 14px; text-align: left;
  }
  .pstrip { display: flex; gap: 2px; height: 18px; border-radius: 6px; overflow: hidden; }
  .pstrip i { flex: 1; display: block; }
  .pname { font-size: 13.5px; font-weight: 700; }
  .pdesc { font-size: 11.5px; color: var(--sub); line-height: 1.3; }
  .pcard.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pcard.active .pname::after { content: " ✓"; }
  .custombtn { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; }
  .cdots { display: inline-flex; gap: 2px; }
  .cdots i { display: block; width: 12px; height: 12px; border-radius: 3px; }
  .inuse { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .cpanel {
    margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(128,128,128,.10);
    display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; align-items: center;
  }

  /* ---- バーのみモード（残り時間の数字を隠す） ---- */
  body.baronly .readout { display: none; }
  .setbadge { display: none; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  body.baronly .setbadge { display: block; font-size: clamp(30px, 6vw, 56px); margin: 6px 0 16px; }
  body.mini.baronly .setbadge { font-size: clamp(11px, 6.5vh, 16px); margin: 0 0 min(1.2vh, 3px); }
  body.baronly:not(.mini) .bar { margin-top: 0; }
  /* PCアプリで「通常＋非表示モード＋バーのみ」のとき：設定時間の表示を小さくして余白を詰め、バーを横いっぱいに大きくする。
     目盛りの縦横比（縦長にならない）と、目盛りの数(20個)は変えない */
  body.electron.hideui.baronly:not(.mini) .setbadge { font-size: clamp(20px, 4.2vw, 36px); margin: 0 0 8px; }
  body.electron.hideui.baronly:not(.mini) .app { padding-left: 14px; padding-right: 14px; max-width: 1000px; }
  body.electron.hideui.baronly:not(.mini) .bar { padding-left: 10px; padding-right: 10px; }
  body.baronly:not(.mini) .seg { aspect-ratio: 1 / calc(var(--sh, 1) * 1.3); }   /* バーのみは少しだけ大きく */
  button.toggle.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 700; }

  /* ---- 小窓モード（数字とバーだけ表示） ---- */
  /* ---- 右上のウィンドウ操作（枠なしウィンドウ用） ---- */
  .winctl { display: none; position: absolute; top: 6px; right: 8px; gap: 4px; z-index: 5; }
  body.electron .winctl, body.mini .winctl { display: flex; }
  .winbtn {
    padding: 0 9px; font-size: 14px; line-height: 22px; border-radius: 8px;
    opacity: .55; transition: opacity .15s;
  }
  .winbtn:hover:not(:disabled) { opacity: 1; }
  #expandBtn, #minBtn, #closeBtn { display: none; }
  body.mini #expandBtn { display: block; }
  body.electron #minBtn, body.electron #closeBtn { display: block; }
  body.mini .winbtn { opacity: 0; }
  body.mini .app:hover .winbtn { opacity: .85; }
  #closeBtn:hover:not(:disabled) { background: #e5484d; border-color: #e5484d; color: #fff; }
  body.mini { height: 100vh; min-height: 0; overflow: hidden; padding: 6px; }
  body.mini .app {
    height: 100%; margin: 0; max-width: none; padding: 8px 12px;
    border-radius: 14px; box-shadow: none;
    display: flex; flex-direction: column; justify-content: center;
  }
  body.mini .row, body.mini .scale, body.mini .hint, body.mini .colorset { display: none; }
  body.mini .readout { font-size: min(14vw, 26vh); cursor: pointer; }
  body.mini .bar {
    padding: min(1.6vw, 3vh); margin: min(2vw, 3vh) 0 0;
    gap: min(.8vw, 2vh); border-radius: 12px; cursor: pointer;
  }
  body.mini .seg { height: min(9vw, 18vh); aspect-ratio: auto; border-radius: 4px; }
  body.mini #mainRow { display: flex; margin-top: min(1.6vw, 3vh); gap: min(1vw, 2vh); }
  body.mini #mainRow button {
    font-size: clamp(11px, 6.5vh, 20px);
    padding: clamp(3px, 1.6vh, 10px) clamp(10px, 3vw, 24px);
    border-radius: 10px; min-width: 0;
  }
  body.mini #miniBtn { display: none; }
  body.mini.baronly .bar { margin: 0; }
  body.mini.baronly .seg { height: min(11vw, 26vh); aspect-ratio: auto; }

  /* ---- 小窓：操作ボタンの表示／非表示 ---- */
  .minitoggle { display: none; }
  body.mini .minitoggle, body.hideui .minitoggle {
    display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 3; min-width: 0; white-space: nowrap; border-radius: 999px;
    font-size: clamp(10px, 5.5vh, 13px); line-height: 1.25; padding: .15em .9em;
    background: var(--panel); color: var(--text); border: 1px solid rgba(128,128,128,.6);
    cursor: pointer;
    opacity: 0; visibility: hidden;
    transition: opacity .12s, visibility 0s .12s;
  }
  /* バーの上にカーソルを少し止めたときだけ表示する（0.25秒の間を置く） */
  body.mini .bar:hover .minitoggle, body.mini .minitoggle:focus-visible,
  body.hideui .bar:hover .minitoggle, body.hideui .minitoggle:focus-visible {
    opacity: 1; visibility: visible;
    transition: opacity .15s .25s, visibility 0s .25s;
  }
  body.mini .minitoggle:hover:not(:disabled), body.hideui .minitoggle:hover:not(:disabled) { background: var(--panel); box-shadow: inset 0 0 0 999px rgba(128,128,128,.18); }
  /* ---- 集中モード（色の選択を隠す）／非表示モード（通常サイズで、一時停止以外を隠す） ---- */
  body.focus #colors, body.focus #colorSet { display: none; }
  body.mini #focusBtn, body.mini #hideBtn { display: none; }
  /* 残すのは「スタート/一時停止」「リセット」「非表示モード」と、時間の設定。それ以外のボタン・オプションは隠す */
  body.hideui .scale, body.hideui .hint, body.hideui .colorset, body.hideui #colors, body.hideui .optrow,
  body.hideui #miniBtn, body.hideui #barOnlyBtn, body.hideui #themeBtn, body.hideui #navyBtn, body.hideui #focusBtn { display: none; }
  body.hideui .minitoggle { font-size: 14px; }
  /* タッチ操作の端末にはカーソルがないので、非表示モードでは「操作を表示」を常に出す */
  @media (hover: none) { body.hideui .minitoggle { opacity: 1; visibility: visible; } }
  /* 小窓では、操作ボタンを表示していても隠していても、一時停止／再生ボタンを左上に常に表示する */
  .miniplay { display: none; }
  body.mini .miniplay {
    display: flex; align-items: center; justify-content: center;
    position: absolute; z-index: 4;
    top: clamp(3px, 3vh, 8px); left: clamp(6px, 2.6vh, 12px);
    width: clamp(18px, 24vh, 30px); height: clamp(18px, 24vh, 30px);
    padding: 0; min-width: 0; border-radius: 50%;
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  body.mini .miniplay:hover:not(:disabled) { background: var(--accent); filter: brightness(1.12); }
  /* バーのみでも通常と同じ大きさにし、上の段(設定時間の行)をボタンと同じ高さにして、バーに重ならないようにする */
  body.mini.baronly .setbadge {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(clamp(3px, 3vh, 8px) + clamp(18px, 24vh, 30px) - 4px);
  }
  .miniplay svg { width: 56%; height: 56%; fill: currentColor; display: block; }
  .miniplay .ico-pause { display: none; }
  .miniplay[data-state="run"] .ico-play { display: none; }
  .miniplay[data-state="run"] .ico-pause { display: block; }
  /* 隠している間は、スタート等のボタン行を非表示にする（右上の窓操作⤢−×は、カーソルを乗せると表示できる） */
  body.mini.ctrlhidden #mainRow { display: none; }
  /* 小さなウィンドウでは窓操作ボタンも小さくして、バーや切り替えボタンと重なりにくくする */
  body.mini .winctl { top: clamp(2px, 2.5vh, 6px); right: clamp(4px, 2vh, 8px); gap: clamp(2px, 1vh, 4px); }
  body.mini .winbtn {
    font-size: clamp(11px, 7vh, 14px); line-height: clamp(14px, 9vh, 22px);
    padding: 0 clamp(6px, 3vh, 9px); min-width: 0;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="winctl">
    <button class="winbtn" id="expandBtn" title="通常表示に戻す（Escキー）" aria-label="通常表示に戻す">⤢</button>
    <button class="winbtn" id="minBtn" title="最小化" aria-label="最小化">−</button>
    <button class="winbtn" id="closeBtn" title="閉じる" aria-label="閉じる">×</button>
  </div>
  <button class="miniplay" id="miniPlay" data-state="idle" title="スタート" aria-label="スタート">
    <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
    <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/></svg>
  </button>
  <div class="readout" id="readout">25:00</div>
  <div class="setbadge" id="setBadge" title="設定した時間">25分</div>

  <div class="bar" id="bar" role="group" aria-label="残り時間の目盛り">
    <button class="minitoggle" id="miniToggle" aria-expanded="false" aria-controls="mainRow">操作を表示</button>
  </div>
  <div class="scale">
    <span>終了</span>
    <span id="segInfo">1目盛り＝1分15秒</span>
    <span id="maxLabel">25分</span>
  </div>
  <div class="hint" id="hint">スライダーやボタンで時間を設定できます</div>

  <div class="row" id="mainRow">
    <button class="primary" id="startBtn">スタート</button>
    <button id="resetBtn">リセット</button>
    <button id="miniBtn" title="数字とバーだけの小さな表示にします（Mキー）">小窓モード</button>
    <button id="barOnlyBtn" class="toggle" aria-pressed="false" title="バーのみモード：残り時間の数字を隠し、バーだけで経過を見ます（Bキー）">バーのみ</button>
    <button id="themeBtn" class="toggle" aria-pressed="false" title="ダークモードの切り替え">ダーク</button>
    <button id="navyBtn" class="toggle" aria-pressed="false" title="ダークブルーモードの切り替え">ダークブルー</button>
    <button id="focusBtn" class="toggle" aria-pressed="false" title="集中モード：色の選択（色のボタン・色の組み合わせ）を隠します（Fキー）">集中モード</button>
    <button id="hideBtn" class="toggle" aria-pressed="false" title="非表示モード：スタート/一時停止・リセット・時間の設定以外を隠します。バーの上にカーソルを止めると「操作を表示」が出ます（Hキー）">非表示モード</button>
  </div>

  <div class="row">
    <button class="adj" id="m5">−5分</button>
    <button class="adj" id="m1">−1分</button>
    <span class="setlabel" id="setLabel">25分</span>
    <button class="adj" id="p1">＋1分</button>
    <button class="adj" id="p5">＋5分</button>
  </div>
  <div class="row">
    <input type="range" id="slider" min="1" max="120" step="1" value="25" aria-label="タイマーの時間（分）">
  </div>

  <div class="row" id="presets"></div>

  <div class="row" id="colors"></div>
  <div class="colorset" id="colorSet">
    <div class="cs-title">進行度に応じた色の組み合わせ</div>
    <div class="cs-note">左の色から順に、残りが「多い → 中間 → 少ない」のときの色です。</div>
    <div class="pgrid" id="pgrid" role="group" aria-label="色の組み合わせ"></div>
    <button class="custombtn toggle" id="customBtn" aria-expanded="false" aria-controls="customPanel"
            title="3つの色を自由に選びます">
      <span class="cdots" id="cdots"><i></i><i></i><i></i></span>
      <span>自由に色を選ぶ</span>
      <span class="inuse" id="inuse" hidden>✓ カスタム使用中</span>
    </button>
    <div class="cpanel" id="customPanel" hidden>
      <label class="stage">残り多い（50%超）<input type="color" id="stage0"></label>
      <label class="stage">中間（25〜50%）<input type="color" id="stage1"></label>
      <label class="stage">残り少ない（25%以下）<input type="color" id="stage2"></label>
      <button class="tiny" id="stageReset" title="既定（緑・黄・赤）に戻す">既定に戻す</button>
    </div>
  </div>
  <div class="row optrow" id="shapeRow" role="group" aria-label="バーの形">
    <span class="stagelabel">バーの形</span>
    <button class="toggle shapebtn" data-shape="scale" aria-pressed="false" title="細い目盛りが隙間少なく並ぶ形"><span class="shp shp-scale"><i></i><i></i><i></i><i></i><i></i></span>目盛りバー</button>
    <button class="toggle shapebtn" data-shape="block" aria-pressed="false" title="縦長の角丸ブロック（前回の形）"><span class="shp shp-block"><i></i><i></i><i></i></span>ブロック</button>
    <button class="toggle shapebtn" data-shape="round" aria-pressed="false" title="四角い角丸の目盛り（以前の形）"><span class="shp shp-round"><i></i><i></i><i></i></span>丸いバー</button>
  </div>
  <div class="row optrow">
    <label class="chk"><input type="checkbox" id="autoChk" checked> 残りに応じて色を変える</label>
    <label class="chk"><input type="checkbox" id="fadeChk" checked> 消えていく目盛りをうっすら点滅させる</label>
    <label class="chk"><input type="checkbox" id="glowChk" checked> 目盛りの光のにじみを表示する</label>
    <label class="chk"><input type="checkbox" id="soundChk" checked> 終了時に音を鳴らす</label>
    <label class="chk" title="非表示モードに入っても、画面（カード）の大きさを変えず、隠した部分を空白にします"><input type="checkbox" id="keepChk" checked> 非表示モードで画面の大きさを保つ（隠した部分を空白にする）</label>
  </div>
  <div class="row optrow">
    <label class="chk"><input type="checkbox" id="notifyChk"> 通知欄に残り時間と進行度を表示する</label>
    <button class="tiny" id="notifyTest" hidden>通知を試す</button>
  </div>
  <div class="notehint optrow" id="notifyHint" role="status"></div>
</div>

<script>
(function () {
  var N = 10;   // スマホ版は目盛りを少なくして、1つずつを大きくする
  var colors = ['#2fa862', '#2f7be0', '#e03b2f', '#f08a24', '#8a4fd1'];
  var presets = [5, 10, 15, 25, 30, 45, 60, 90];

  var state = {
    setMin: 25,
    setSec: 25 * 60,
    remainSec: 25 * 60,
    running: false,
    done: false,
    endAt: 0,
    color: colors[0],
    auto: true,
    sound: true,
    barOnly: false,
    theme: 'auto',
    fade: true,
    glow: true,
    stageColors: ['#2fa862', '#f0b323', '#e03b2f'],
    shape: 'scale',   // バーの形：scale（目盛りバー）／block（ブロック）／round（丸いバー）
    keepSpace: true   // 非表示モードで、隠した部分を空白にして画面の大きさを保つ
  };
  var SHAPES = ['scale', 'block', 'round'];

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), bar = $('bar'), readout = $('readout'), hint = $('hint');
  var startBtn = $('startBtn'), resetBtn = $('resetBtn'), slider = $('slider');
  var setLabel = $('setLabel'), segInfo = $('segInfo'), maxLabel = $('maxLabel');
  var segs = [], audioCtx = null, timerId = null;
  var notif = null;   // 通知の仕組み（下で作成）

  // ---- 保存と読み込み ----
  function save() {
    try {
      localStorage.setItem('vtimerBar', JSON.stringify({ setMin: state.setMin, color: state.color, auto: state.auto, sound: state.sound, fade: state.fade, glow: state.glow, barOnly: state.barOnly, theme: state.theme, stageColors: state.stageColors, shape: state.shape, keepSpace: state.keepSpace }));
    } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem('vtimerBar') || 'null');
      if (d) {
        if (d.setMin >= 1 && d.setMin <= 120) state.setMin = Math.round(d.setMin);
        if (colors.indexOf(d.color) >= 0) state.color = d.color;
        if (typeof d.auto === 'boolean') state.auto = d.auto;
        if (typeof d.sound === 'boolean') state.sound = d.sound;
        if (typeof d.fade === 'boolean') state.fade = d.fade;
        if (typeof d.glow === 'boolean') state.glow = d.glow;
        if (typeof d.barOnly === 'boolean') state.barOnly = d.barOnly;
        if (d.theme === 'auto' || d.theme === 'light' || d.theme === 'dark' || d.theme === 'navy') state.theme = d.theme;
        if (SHAPES.indexOf(d.shape) >= 0) state.shape = d.shape;
        if (typeof d.keepSpace === 'boolean') state.keepSpace = d.keepSpace;
        if (Array.isArray(d.stageColors) && d.stageColors.length === 3 &&
            d.stageColors.every(function (c) { return /^#[0-9a-fA-F]{6}$/.test(c); })) state.stageColors = d.stageColors;
      }
    } catch (e) {}
    state.setSec = state.setMin * 60;
    state.remainSec = state.setSec;
  }

  // ---- 表示用の整形 ----
  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtSeg(sec) {
    var r = Math.round(sec), m = Math.floor(r / 60), s = r % 60;
    if (m === 0) return s + '秒';
    if (s === 0) return m + '分';
    return m + '分' + s + '秒';
  }
  function autoColor(rs) {
    var ratio = (rs == null ? state.remainSec : rs) / state.setSec;
    if (ratio > 0.5) return state.stageColors[0];
    if (ratio > 0.25) return state.stageColors[1];
    return state.stageColors[2];
  }

  // ---- 目盛りの生成 ----
  for (var i = 0; i < N; i++) {
    var d = document.createElement('div');
    d.className = 'seg';
    bar.appendChild(d);
    segs.push(d);
  }

  // 残り秒数から、点灯する目盛りの数と色を決める（画面表示と通知で共通）
  function litCount(rs) {
    var segSec = state.setSec / N;
    if (state.done) return N;
    if (rs <= 0) return 0;
    return Math.min(N, Math.ceil(rs / segSec - 1e-9));
  }
  function litColorFor(rs) {
    return state.done ? (state.auto ? state.stageColors[2] : state.color) : (state.auto ? autoColor(rs) : state.color);
  }

  // ---- 描画 ----
  function render() {
    var segSec = state.setSec / N;
    var lit = litCount(state.remainSec);
    var litColor = litColorFor(state.remainSec);
    document.documentElement.style.setProperty('--lit', litColor);
    document.documentElement.style.setProperty('--accent', state.auto ? '#2f7be0' : state.color);

    for (var i = 0; i < N; i++) {
      segs[i].classList.toggle('on', i < lit);
      segs[i].classList.toggle('cur', state.running && !state.done && i === lit - 1);
    }

    readout.textContent = fmt(state.remainSec);
    document.title = (state.running && !state.barOnly ? fmt(state.remainSec) + ' ' : '') + 'ビジュアルタイマー（横型）';
    var mp = $('miniPlay');
    mp.dataset.state = state.running ? 'run' : 'idle';
    var mpLabel = state.running ? '一時停止' : (state.remainSec < state.setSec && state.remainSec > 0 ? '再開' : 'スタート');
    mp.title = mpLabel; mp.setAttribute('aria-label', mpLabel);
    startBtn.textContent = state.running ? '一時停止' : (state.remainSec < state.setSec && state.remainSec > 0 ? '再開' : 'スタート');

    setLabel.textContent = state.setMin + '分';
    $('setBadge').textContent = state.setMin + '分';
    maxLabel.textContent = state.setMin + '分';
    segInfo.textContent = '1目盛り＝' + fmtSeg(segSec);
    slider.value = state.setMin;

    var untouched = !state.running && state.remainSec === state.setSec;
    var ps = document.querySelectorAll('.preset');
    for (var j = 0; j < ps.length; j++) {
      ps[j].classList.toggle('active', Number(ps[j].dataset.min) === state.setMin && untouched);
    }
    var sw = document.querySelectorAll('.swatch');
    for (var k = 0; k < sw.length; k++) {
      sw[k].classList.toggle('active', !state.auto && sw[k].dataset.color === state.color);
    }
    app.classList.toggle('done', state.done);
    document.body.classList.toggle('nofade', !state.fade);
    document.body.classList.toggle('noglow', !state.glow);
    document.body.classList.toggle('baronly', state.barOnly);
    $('barOnlyBtn').classList.toggle('on', state.barOnly);
    $('barOnlyBtn').setAttribute('aria-pressed', state.barOnly ? 'true' : 'false');

    // 計測中は時間の変更ができない
    var locked = document.querySelectorAll('.adj, .preset, #slider');
    for (var n = 0; n < locked.length; n++) locked[n].disabled = state.running;
    if (notif) notif.sync(false);
  }

  // ---- 音 ----
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function beep(times) {
    if (!state.sound || !audioCtx) return;
    for (var i = 0; i < times; i++) {
      var t = audioCtx.currentTime + i * 0.5;
      var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.4);
    }
  }

  // ---- 画面を点灯したままにする（計測中だけ） ----
  var wakeLock = null;
  function requestWake() {
    try {
      if (navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request('screen').then(function (l) {
          wakeLock = l;
          l.addEventListener('release', function () { wakeLock = null; });
          if (!state.running) releaseWake();
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }
  // 別のアプリから戻ったとき、画面の点灯維持をかけ直し、表示も最新にする
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state.running) { requestWake(); tick(); }
  });

  // ---- タイマーの動作 ----
  function tick() {
    var left = (state.endAt - Date.now()) / 1000;
    if (left <= 0) {
      state.remainSec = 0;
      stop();
      state.done = true;
      hint.textContent = '時間です。リセットで元の時間に戻ります';
      beep(3);
      try { if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
    } else {
      state.remainSec = left;
    }
    render();
  }
  function start() {
    if (state.remainSec <= 0 || state.done) state.remainSec = state.setSec;
    state.done = false;
    ensureAudio();
    state.running = true;
    state.endAt = Date.now() + state.remainSec * 1000;
    hint.textContent = '計測中';
    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, 100);
    requestWake();
    render();
  }
  function stop() {
    state.running = false;
    releaseWake();
    if (timerId) { clearInterval(timerId); timerId = null; }
  }
  function pause() {
    if (!state.running) return;
    state.remainSec = Math.max(0, (state.endAt - Date.now()) / 1000);
    stop();
    hint.textContent = '一時停止中';
    render();
  }
  function reset() {
    stop();
    state.done = false;
    state.remainSec = state.setSec;
    hint.textContent = 'スライダーやボタンで時間を設定できます';
    render();
  }
  function setMinutes(min) {
    min = Math.max(1, Math.min(120, Math.round(min)));
    stop();
    state.done = false;
    state.setMin = min;
    state.setSec = min * 60;
    state.remainSec = state.setSec;
    hint.textContent = '設定：' + min + '分';
    save();
    render();
  }

  // ---- 操作 ----
  startBtn.addEventListener('click', function () { state.running ? pause() : start(); });
  resetBtn.addEventListener('click', reset);
  $('miniPlay').addEventListener('click', function () { state.running ? pause() : start(); });
  slider.addEventListener('input', function () { setMinutes(Number(slider.value)); });
  $('m5').addEventListener('click', function () { setMinutes(state.setMin - 5); });
  $('m1').addEventListener('click', function () { setMinutes(state.setMin - 1); });
  $('p1').addEventListener('click', function () { setMinutes(state.setMin + 1); });
  $('p5').addEventListener('click', function () { setMinutes(state.setMin + 5); });

  var pr = $('presets');
  presets.forEach(function (m) {
    var b = document.createElement('button');
    b.className = 'preset';
    b.dataset.min = m;
    b.textContent = m + '分';
    b.addEventListener('click', function () { setMinutes(m); });
    pr.appendChild(b);
  });

  var cr = $('colors');
  colors.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'swatch';
    b.dataset.color = c;
    b.style.background = c;
    b.setAttribute('aria-label', '色を選ぶ');
    b.addEventListener('click', function () {
      state.color = c;
      state.auto = false;
      $('autoChk').checked = false;
      save();
      render();
      renderColorUI();
    });
    cr.appendChild(b);
  });

  $('autoChk').addEventListener('change', function (e) { state.auto = e.target.checked; save(); render(); renderColorUI(); });
  $('soundChk').addEventListener('change', function (e) { state.sound = e.target.checked; save(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && mini) { setMini(false); return; }
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'BUTTON') return;
    if (e.code === 'Space') { e.preventDefault(); state.running ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'm' || e.key === 'M') setMini(!mini);
    else if (e.key === 'b' || e.key === 'B') setBarOnly(!state.barOnly);
    else if (e.key === 'h' || e.key === 'H') { if (mini) setMiniControls(!miniCtrlHidden); else setUiHidden(!uiHidden); }
    else if (e.key === 'f' || e.key === 'F') setFocus(!focusMode);
  });

  // ---- 目盛りの演出と色の設定 ----
  // 進行度（残り多い／中間／残り少ない）ごとの色の組み合わせ。先頭が既定
  var stagePresets = [
    { id: 'standard', name: '標準（既定）', desc: '緑 → 黄 → 赤',   colors: ['#2fa862', '#f0b323', '#e03b2f'] },
    { id: 'blue',     name: 'ブルー',       desc: '青 → 黄 → 橙赤', colors: ['#1f6fd0', '#f0b323', '#d63a1a'] },
    { id: 'teal',     name: 'ティール',     desc: '青緑 → 橙 → 紫', colors: ['#1fa89a', '#f08a24', '#a03ad0'] },
    { id: 'dusk',     name: '夕焼け',       desc: '青紫 → 桃 → 橙', colors: ['#6a5ae0', '#e0559c', '#f59e0b'] }
  ];
  var defaultStage = stagePresets[0].colors;
  var stageInputs = [$('stage0'), $('stage1'), $('stage2')];
  var presetBtns = [];

  function sameColors(a, b) {
    for (var i = 0; i < 3; i++) if (String(a[i]).toLowerCase() !== String(b[i]).toLowerCase()) return false;
    return true;
  }
  function currentPresetId() {
    for (var i = 0; i < stagePresets.length; i++) {
      if (sameColors(state.stageColors, stagePresets[i].colors)) return stagePresets[i].id;
    }
    return null; // どのプリセットとも違う＝カスタム
  }
  function syncStageInputs() {
    for (var i = 0; i < 3; i++) stageInputs[i].value = state.stageColors[i];
  }
  function applyStageColors(cols) {
    state.stageColors = cols.slice();
    state.auto = true;
    $('autoChk').checked = true;
    save();
    render();
    renderColorUI();
  }

  // プリセットのカードを作る
  var pgrid = $('pgrid');
  stagePresets.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'pcard';
    b.dataset.id = p.id;
    b.setAttribute('aria-pressed', 'false');
    b.title = p.name + '：' + p.desc;
    b.innerHTML = '<span class="pstrip"><i style="background:' + p.colors[0] + '"></i><i style="background:' + p.colors[1] +
      '"></i><i style="background:' + p.colors[2] + '"></i></span><span class="pname">' + p.name + '</span><span class="pdesc">' + p.desc + '</span>';
    b.addEventListener('click', function () { applyStageColors(p.colors); syncStageInputs(); });
    pgrid.appendChild(b);
    presetBtns.push(b);
  });

  // 選択状態・カスタム使用中の表示を更新する（色の入力欄の値は触らない）
  function renderColorUI() {
    var id = currentPresetId();
    presetBtns.forEach(function (b) {
      var on = b.dataset.id === id;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var custom = id === null;
    $('customBtn').classList.toggle('on', custom);
    $('inuse').hidden = !custom;
    var dots = $('cdots').children;
    for (var i = 0; i < 3; i++) dots[i].style.background = state.stageColors[i];
    $('colorSet').classList.toggle('dim', !state.auto);
  }

  // 自由に色を選ぶ：ボタンを押したときだけカラーピッカーを表示する
  $('customBtn').addEventListener('click', function () {
    var panel = $('customPanel');
    var open = panel.hidden;
    panel.hidden = !open;
    $('customBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) syncStageInputs();
  });
  stageInputs.forEach(function (inp, idx) {
    inp.addEventListener('input', function () {
      var cols = state.stageColors.slice();
      cols[idx] = inp.value;
      applyStageColors(cols);
    });
  });
  $('stageReset').addEventListener('click', function () {
    applyStageColors(defaultStage);
    syncStageInputs();
  });
  $('fadeChk').addEventListener('change', function (e) { state.fade = e.target.checked; save(); render(); });
  $('glowChk').addEventListener('change', function (e) { state.glow = e.target.checked; save(); render(); });

  // ---- 小窓モード ----
  var mini = false;
  // 小窓で操作ボタンを隠しているか（初期状態は隠す。前回の状態を覚える）
  var miniCtrlHidden = true;
  try { miniCtrlHidden = localStorage.getItem('vtimerMiniCtrl') !== '0'; } catch (e) {}
  // 非表示モード（通常サイズ）。小窓にいる間は小窓側の「操作を隠す」が優先され、小窓を出ると元に戻る
  var uiHidden = false;
  var focusMode = false;
  function applyMiniControls() {
    document.body.classList.toggle('ctrlhidden', mini && miniCtrlHidden);
    document.body.classList.toggle('hideui', uiHidden && !mini);
    var hidden = mini ? miniCtrlHidden : uiHidden;
    var t = $('miniToggle');
    t.textContent = hidden ? '操作を表示' : '操作を隠す';
    t.title = (hidden ? '操作ボタンを表示します' : '操作ボタンを隠します') + '（Hキー）';
    t.setAttribute('aria-expanded', hidden ? 'false' : 'true');
    $('hideBtn').classList.toggle('on', uiHidden);
    $('hideBtn').setAttribute('aria-pressed', uiHidden ? 'true' : 'false');
    syncHideSpace();
  }
  // 非表示モードに入る直前の画面（カード）の高さを測り、同じ高さを保つ。隠した部分は下側の空白になる。
  // ただし空白のせいでスクロールバーが出ないよう、高さの上限は「窓の高さ」までにする。
  // 窓の大きさを変えると、この計算をやり直して空白を増減する
  function syncHideSpace() {
    app.style.minHeight = '';
    if (!(state.keepSpace && document.body.classList.contains('hideui'))) return;
    document.body.classList.remove('hideui');
    var h = app.offsetHeight;                 // 隠す前の高さ（窓の幅に合わせて測り直す）
    document.body.classList.add('hideui');
    var cs = getComputedStyle(document.body);
    var avail = document.documentElement.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (h > 0) app.style.minHeight = Math.max(0, Math.min(h, avail)) + 'px';
  }
  var hideSpaceRaf = 0;
  window.addEventListener('resize', function () {
    if (!document.body.classList.contains('hideui') || hideSpaceRaf) return;
    hideSpaceRaf = requestAnimationFrame(function () { hideSpaceRaf = 0; syncHideSpace(); });
  });
  $('keepChk').addEventListener('change', function (e) { state.keepSpace = e.target.checked; save(); syncHideSpace(); });
  function setUiHidden(flag) {
    uiHidden = !!flag;
    applyMiniControls();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function setFocus(flag) {
    focusMode = !!flag;
    document.body.classList.toggle('focus', focusMode);
    $('focusBtn').classList.toggle('on', focusMode);
    $('focusBtn').setAttribute('aria-pressed', focusMode ? 'true' : 'false');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  $('focusBtn').addEventListener('click', function () { setFocus(!focusMode); });
  $('hideBtn').addEventListener('click', function () { setUiHidden(!uiHidden); });
  function setMiniControls(hidden) {
    miniCtrlHidden = !!hidden;
    try { localStorage.setItem('vtimerMiniCtrl', miniCtrlHidden ? '1' : '0'); } catch (e) {}
    applyMiniControls();
    if (mini && window.electronAPI && window.electronAPI.setMiniMode) window.electronAPI.setMiniMode(true, state.barOnly, miniCtrlHidden);
  }
  function setMini(flag) {
    mini = !!flag;
    document.body.classList.toggle('mini', mini);
    applyMiniControls();
    readout.title = (mini && !window.electronAPI) ? 'クリックで開始／一時停止' : '';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (window.electronAPI && window.electronAPI.setMiniMode) window.electronAPI.setMiniMode(mini, state.barOnly, miniCtrlHidden);
    try { localStorage.setItem('vtimerMini', mini ? '1' : '0'); } catch (e) {}
  }
  $('miniBtn').addEventListener('click', function () { setMini(true); });
  $('expandBtn').addEventListener('click', function () { setMini(false); });
  $('miniToggle').addEventListener('click', function (e) {
    e.stopPropagation(); // バー全体のクリック（開始／停止）として扱わない
    if (mini) setMiniControls(!miniCtrlHidden); else setUiHidden(!uiHidden);
    this.blur();
  });
  function toggleRun() { state.running ? pause() : start(); }
  readout.addEventListener('click', function () { if (mini) toggleRun(); });
  bar.addEventListener('click', function () { if (mini) toggleRun(); });

  // ---- バーのみモード（残り時間の数字を隠す） ----
  function setBarOnly(flag) {
    state.barOnly = !!flag;
    save();
    render();
    if (mini && window.electronAPI && window.electronAPI.setMiniMode) window.electronAPI.setMiniMode(true, state.barOnly, miniCtrlHidden);
  }
  $('barOnlyBtn').addEventListener('click', function () { setBarOnly(!state.barOnly); });

  // ---- ダークモード ----
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() {
    return state.theme === 'dark' || state.theme === 'navy' || (state.theme === 'auto' && !!darkQuery && darkQuery.matches);
  }
  function applyTheme() {
    if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', state.theme);
    var plainDark = isDark() && state.theme !== 'navy';
    $('themeBtn').classList.toggle('on', plainDark);
    $('themeBtn').setAttribute('aria-pressed', plainDark ? 'true' : 'false');
    $('navyBtn').classList.toggle('on', state.theme === 'navy');
    $('navyBtn').setAttribute('aria-pressed', state.theme === 'navy' ? 'true' : 'false');
  }
  $('themeBtn').addEventListener('click', function () {
    state.theme = (isDark() && state.theme !== 'navy') ? 'light' : 'dark';
    save();
    applyTheme();
  });
  $('navyBtn').addEventListener('click', function () {
    state.theme = state.theme === 'navy' ? 'light' : 'navy';
    save();
    applyTheme();
  });
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', applyTheme);

  // ---- バーの形 ----
  function applyShape() {
    SHAPES.forEach(function (s) { document.body.classList.toggle('shape-' + s, state.shape === s); });
    var bs = document.querySelectorAll('.shapebtn');
    for (var i = 0; i < bs.length; i++) {
      var on = bs[i].dataset.shape === state.shape;
      bs[i].classList.toggle('on', on);
      bs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }
  var shapeBtns = document.querySelectorAll('.shapebtn');
  for (var si = 0; si < shapeBtns.length; si++) {
    shapeBtns[si].addEventListener('click', function () {
      state.shape = this.dataset.shape;
      save();
      applyShape();
      render();
      this.blur();
    });
  }


  // ---- 通知（Android Chrome：Service Worker の showNotification を使用） ----
  notif = (function () {
    var TAG = 'vtimer-main', KEY = 'vtimerNotify';
    var SLOW = 15000, FAST = 5000;   // 画面を離れている間の更新間隔（残り2分超／2分以下）。省電力のため控えめにする
    var enabled = false, reg = null, shown = false;
    var lastSig = '', lastTsig = '', lastAt = 0, busy = false, queued = null;

    function supported() {
      return ('Notification' in window) && ('serviceWorker' in navigator) && window.isSecureContext && location.protocol !== 'file:';
    }
    function getReg() {
      if (reg) return Promise.resolve(reg);
      return Promise.race([
        navigator.serviceWorker.ready,
        new Promise(function (_, rej) { setTimeout(function () { rej(new Error('sw timeout')); }, 5000); })
      ]).then(function (r) { reg = r; return r; });
    }

    // タイマー本体と同じ計算（endAt と Date.now() が基準）で、今の状態を求める
    function snap() {
      var remain = state.done ? 0 : (state.running ? Math.max(0, (state.endAt - Date.now()) / 1000) : state.remainSec);
      var status = state.done ? 'done' : state.running ? 'running'
        : (state.remainSec < state.setSec && state.remainSec > 0 ? 'paused' : 'idle');
      return { remain: remain, status: status, lit: litCount(remain), color: litColorFor(remain) };
    }
    function hhmm(t) {
      var d = new Date(t);
      return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    }
    // 画像が使えない場合の代わりに、本文で色付きブロックを使う（色相から近い絵文字を選ぶ）
    function blockFor(hex) {
      var r = parseInt(hex.substr(1, 2), 16) / 255, g = parseInt(hex.substr(3, 2), 16) / 255, b = parseInt(hex.substr(5, 2), 16) / 255;
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, hue = 0;
      if (d > 0) {
        if (mx === r) hue = 60 * (((g - b) / d + 6) % 6);
        else if (mx === g) hue = 60 * ((b - r) / d + 2);
        else hue = 60 * ((r - g) / d + 4);
      }
      if (hue < 15 || hue >= 320) return '🟥';   // 🟥
      if (hue < 40) return '🟧';                  // 🟧
      if (hue < 70) return '🟨';                  // 🟨
      if (hue < 175) return '🟩';                 // 🟩
      if (hue < 255) return '🟦';                 // 🟦
      return '🟪';                                // 🟪
    }
    function blocks(s) {
      var on = blockFor(s.color), off = isDark() ? '⬛' : '⬜';   // ⬛ / ⬜
      var out = '';
      for (var i = 0; i < N; i++) out += i < s.lit ? on : off;
      return out;
    }
    function bodyText(s) {
      var t = fmt(s.remain), line1, line3;
      if (s.status === 'running') { line1 = '▶ 計測中　残り ' + t; line3 = '終了予定 ' + hhmm(state.endAt) + '（' + state.setMin + '分タイマー）'; }
      else if (s.status === 'paused') { line1 = '⏸ 一時停止中　残り ' + t; line3 = state.setMin + '分タイマー'; }
      else if (s.status === 'done') { line1 = '⏰ 時間です（終了）'; line3 = state.setMin + '分タイマーが終わりました'; }
      else { line1 = '⏹ 待機中　' + t; line3 = state.setMin + '分タイマー'; }
      return line1 + '\n' + blocks(s) + '\n' + line3;
    }

    // 進行度の画像（Canvasで描いたPNG）。通知にはHTML/CSSを使えないので、画像として渡す
    function makeImage(s) {
      var c = document.createElement('canvas');
      c.width = 800; c.height = 400;
      var g = c.getContext('2d');
      var cs = getComputedStyle(document.documentElement);
      var v = function (n, d) { return (cs.getPropertyValue(n) || '').trim() || d; };
      var panel = v('--panel', '#ffffff'), off = v('--off', '#e2dfd8'), text = v('--text', '#2b2b2b'), sub = v('--sub', '#777777');
      g.fillStyle = panel; g.fillRect(0, 0, 800, 400);
      g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      var fam = '"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif';
      var label = { running: '計測中', paused: '一時停止中', done: '時間です', idle: '待機中' }[s.status];
      g.fillStyle = sub; g.font = '600 34px ' + fam; g.fillText(label, 400, 62);
      g.fillStyle = text; g.font = '700 128px ' + fam; g.fillText(fmt(s.remain), 400, 192);
      var scaleShape = state.shape === 'scale';
      var x0 = 40, w = 720, gap = scaleShape ? 3 : 6, tw = (w - gap * (N - 1)) / N, y = 236, th = 92;
      for (var i = 0; i < N; i++) {
        g.fillStyle = i < s.lit ? s.color : off;
        var x = x0 + i * (tw + gap), r = scaleShape ? 2 : 7;
        g.beginPath();
        g.moveTo(x + r, y); g.lineTo(x + tw - r, y); g.quadraticCurveTo(x + tw, y, x + tw, y + r);
        g.lineTo(x + tw, y + th - r); g.quadraticCurveTo(x + tw, y + th, x + tw - r, y + th);
        g.lineTo(x + r, y + th); g.quadraticCurveTo(x, y + th, x, y + th - r);
        g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.fill();
      }
      g.fillStyle = sub; g.font = '500 30px ' + fam;
      g.fillText(s.status === 'running' ? '終了予定 ' + hhmm(state.endAt) + '　/　設定 ' + state.setMin + '分' : '設定 ' + state.setMin + '分', 400, 372);
      return c.toDataURL('image/png');
    }

    function post(s, structural) {
      if (busy) { queued = [s, structural]; return; }
      busy = true;
      var isDone = s.status === 'done';
      getReg().then(function (r) {
        return r.getNotifications({ tag: TAG }).then(function (list) {
          // 利用者が通知を消したあとは、操作（開始・一時停止など）があるまで勝手に出し直さない
          if (!structural && !list.length) return;
          var opts = {
            body: bodyText(s), tag: TAG, lang: 'ja', icon: 'icon-192.png', badge: 'badge-96.png',
            renotify: isDone, silent: !isDone, timestamp: Date.now(), data: { kind: s.status }
          };
          if (isDone) opts.vibrate = [400, 200, 400, 200, 400];
          try { if ('image' in Notification.prototype) opts.image = makeImage(s); } catch (e) {}
          shown = true;
          return r.showNotification('ビジュアルタイマー', opts);
        });
      }).catch(function () {}).then(function () {
        busy = false;
        if (queued) { var q = queued; queued = null; post(q[0], q[1]); }
      });
    }

    function sync(force) {
      if (!enabled) return;
      var s = snap();
      if (s.status === 'idle' && !shown) return;   // 一度も開始していない待機中は出さない（「通知を試す」だけ例外）
      var sig = [s.status, state.setMin, s.color, isDark() ? 1 : 0, state.stageColors.join()].join('|');
      var tsig = fmt(s.remain) + '|' + s.lit;
      var structural = !!force || sig !== lastSig;
      if (!structural) {
        if (s.status !== 'running') return;          // 止まっている間は表示が変わらない
        if (document.visibilityState !== 'hidden') return;   // 画面を見ている間は通知を更新しない（省電力）
        if (Date.now() - lastAt < (s.remain > 120 ? SLOW : FAST)) return;
        if (tsig === lastTsig) return;
      }
      lastSig = sig; lastTsig = tsig; lastAt = Date.now();
      post(s, structural);
    }

    // ---- 設定画面 ----
    var chk = $('notifyChk'), hint = $('notifyHint'), testBtn = $('notifyTest');
    function refreshUI() {
      var ok = supported();
      var perm = ok ? Notification.permission : 'unsupported';
      if (enabled && perm !== 'granted') enabled = false;   // 許可が取り消された
      chk.checked = enabled;
      testBtn.hidden = !enabled;
      if (!ok) {
        hint.textContent = 'この環境では通知を使えません。AndroidのChromeで、https のアドレス（公開したページ）から開いてください。';
      } else if (perm === 'denied') {
        hint.textContent = '通知がブロックされています。Chromeの「︙」→「設定」→「サイトの設定」→「通知」でこのサイトを許可するか、ホーム画面のアイコンを長押しして「アプリ情報」→「通知」で許可してから、もう一度チェックしてください。';
      } else if (enabled) {
        hint.textContent = '有効です。他のアプリを使っている間も、通知欄に残り時間と進行度を表示します。Androidの省電力で更新が遅れることがあるため、終了予定の時刻も表示しています。通知を消すと、次の操作（スタート・一時停止など）までは出し直しません。';
      } else {
        hint.textContent = 'チェックすると、通知の許可を求める画面が出ます。';
      }
    }
    function save() { try { localStorage.setItem(KEY, enabled ? '1' : '0'); } catch (e) {} }
    function enable() { enabled = true; save(); refreshUI(); sync(true); }
    function disable() {
      enabled = false; save(); shown = false; lastSig = ''; refreshUI();
      getReg().then(function (r) { return r.getNotifications({ tag: TAG }); })
        .then(function (list) { list.forEach(function (n) { n.close(); }); }).catch(function () {});
    }
    chk.addEventListener('change', function () {
      if (!chk.checked) { disable(); return; }
      if (!supported()) { chk.checked = false; refreshUI(); return; }
      var p = Notification.permission;
      if (p === 'granted') enable();
      else if (p === 'denied') { chk.checked = false; refreshUI(); }
      else {
        var done = function (r) { if (r === 'granted') enable(); else { chk.checked = false; refreshUI(); } };
        try {
          var pr = Notification.requestPermission(done);   // 古い形式（コールバック）にも対応
          if (pr && pr.then) pr.then(done);
        } catch (e) { chk.checked = false; refreshUI(); }
      }
    });
    testBtn.addEventListener('click', function () { shown = true; sync(true); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') sync(true);   // 別のアプリへ移った瞬間に最新へ更新
    });
    try {
      if (supported() && navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'notifications' }).then(function (p) { p.onchange = refreshUI; }).catch(function () {});
      }
      if (supported() && localStorage.getItem(KEY) === '1' && Notification.permission === 'granted') enabled = true;
    } catch (e) {}
    refreshUI();
    return { sync: sync, snap: snap, isEnabled: function () { return enabled; } };
  })();

  // ---- 初期化 ----
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
  load();
  applyShape();
  $('autoChk').checked = state.auto;
  $('soundChk').checked = state.sound;
  $('fadeChk').checked = state.fade;
  $('glowChk').checked = state.glow;
  $('keepChk').checked = state.keepSpace;
  syncStageInputs();
  renderColorUI();
  applyTheme();
  applyMiniControls();
  render();
  try {
    if (window.electronAPI && window.electronAPI.setMiniMode && localStorage.getItem('vtimerMini') === '1') setMini(true);
  } catch (e) {}
})();
</script>
</body>
</html>
